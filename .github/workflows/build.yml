name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Smoke test Paper + Rebar + GridWorks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          INPUT_PIPE="$RUNNER_TEMP/gridworks-smoke-input"
          LOG_FILE="$RUNNER_TEMP/gridworks-smoke.log"
          rm -f "$INPUT_PIPE" "$LOG_FILE"
          mkfifo "$INPUT_PIPE"

          ./gradlew runServer --stacktrace --no-daemon < "$INPUT_PIPE" > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!

          exec 3>"$INPUT_PIPE"

          READY=0
          for _ in $(seq 1 120); do
            if grep -Fq "Validated 21 GridWorks content entries and survival recipes." "$LOG_FILE" \
              && grep -Fq "GridWorks control bus initialized" "$LOG_FILE" \
              && grep -Fq "Done (" "$LOG_FILE"; then
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [[ "$READY" -ne 1 ]]; then
            echo "GridWorks did not reach the expected ready state."
            cat "$LOG_FILE"
            echo "stop" >&3 || true
            exec 3>&-
            wait "$SERVER_PID" || true
            exit 1
          fi

          if grep -Eq "Error occurred while enabling GridWorks|GridWorks failed to enable|Could not load plugin.*GridWorks" "$LOG_FILE"; then
            echo "GridWorks startup emitted a fatal plugin error."
            cat "$LOG_FILE"
            echo "stop" >&3 || true
            exec 3>&-
            wait "$SERVER_PID" || true
            exit 1
          fi

          echo "gridworks doctor" >&3

          DOCTOR_READY=0
          for _ in $(seq 1 15); do
            if grep -Fq "GridWorks Doctor complete." "$LOG_FILE"; then
              DOCTOR_READY=1
              break
            fi
            sleep 1
          done

          if [[ "$DOCTOR_READY" -ne 1 ]]; then
            echo "The live GridWorks doctor command did not complete."
            cat "$LOG_FILE"
            echo "stop" >&3 || true
            exec 3>&-
            wait "$SERVER_PID" || true
            exit 1
          fi

          echo "stop" >&3
          exec 3>&-

          STOPPED=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              STOPPED=1
              break
            fi
            sleep 1
          done

          if [[ "$STOPPED" -ne 1 ]]; then
            echo "Paper/Gradle did not stop within 30 seconds."
            cat "$LOG_FILE"
            kill "$SERVER_PID" 2>/dev/null || true
            sleep 2
            kill -9 "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" || true
            exit 1
          fi

          if ! wait "$SERVER_PID"; then
            echo "Paper/Gradle exited unsuccessfully after the smoke test."
            cat "$LOG_FILE"
            exit 1
          fi

          if grep -Eiq "GridWorks cleanup failed|Error occurred while disabling GridWorks|(ERROR|SEVERE).*GridWorks" "$LOG_FILE"; then
            echo "GridWorks emitted an error during startup, doctor, or shutdown."
            cat "$LOG_FILE"
            exit 1
          fi

          echo "GridWorks Paper smoke test passed."
          grep -F "Validated 21 GridWorks content entries and survival recipes." "$LOG_FILE"
          grep -F "GridWorks control bus initialized" "$LOG_FILE"
          grep -F "Done (" "$LOG_FILE"
          grep -F "GridWorks Doctor complete." "$LOG_FILE"

      - name: Publish raw development JAR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_GridWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "GridWorks JAR was not produced."
            exit 1
          fi

          if gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/tags/dev-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null

            RELEASE_ID="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/dev-build" --jq '.id')"
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f target_commitish="$GITHUB_SHA" \
              -f body="Rolling raw JAR from the latest successful smoke-tested main build. Tested commit: $GITHUB_SHA. Development snapshot; not a stable release." >/dev/null

            gh release upload dev-build "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create dev-build "$JAR" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GridWorks Development Build" \
              --notes "Rolling raw JAR from the latest successful smoke-tested main build. Tested commit: $GITHUB_SHA. Development snapshot; not a stable release." \
              --prerelease
          fi
