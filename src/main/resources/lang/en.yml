addon: "GridWorks"

item:
  control_interface:
    name: "Control Interface"
    lore: |-
      <arrow> Connects a device to the GridWorks Control Bus
      <arrow> Use a GridWorks Linker to connect control nodes

  alarm_console:
    name: "Alarm Console"
    lore: |-
      <arrow> Central view of active Alarm Indicators on the Control Bus
      <arrow> Shows named/severity alarm state with per-alarm acknowledgement
      <arrow> Filter All, Warning+, Critical, Latched, or Unacknowledged alarms
      <arrow> Refreshes by replaying state; never scans or loads chunks

  alarm_indicator:
    name: "Alarm Indicator"
    lore: |-
      <arrow> Latches faults until they are acknowledged or safely cleared
      <arrow> Rings once on a real false-to-true transition
      <arrow> Name alarms, set Critical/Warning/Info severity, and acknowledge them
      <arrow> Optional timed escalation raises unacknowledged alarms one level
      <arrow> Restart replay stays silent

  redstone_sensor:
    name: "Redstone Sensor"
    lore: |-
      <arrow> Reads redstone power without polling every tick
      <arrow> Publishes powered state and signal strength
      <arrow> Re-sends current state when a linked peer reconnects

  status_light:
    name: "Status Light"
    lore: |-
      <arrow> Displays the boolean redstone state from the Control Bus
      <arrow> Nearby vanilla redstone cannot take over its state
      <arrow> Link it to a Redstone Sensor with a GridWorks Linker

  addressed_relay:
    name: "Addressed Relay"
    lore: |-
      <arrow> Converts one addressed Control Bus command into vanilla redstone
      <arrow> Give it a human-readable address such as ore_line_1
      <arrow> Multiple relays may share an address to form a control group

  cargo_isolator:
    name: "Cargo Isolator"
    lore: |-
      <arrow> Controlled one-stack cargo pass-through built on public Rebar APIs
      <arrow> CLOSED rejects inbound insertion and sets outbound transfer rate to zero
      <arrow> OPEN uses the configured cargo transfer rate
      <arrow> Distinct from Pylon's Cargo Gate, which is a threshold left/right splitter

  control_relay:
    name: "Control Relay"
    lore: |-
      <arrow> Converts a Control Bus boolean into vanilla redstone output
      <arrow> Its lever state is controlled by GridWorks, not manual clicks
      <arrow> Link it to a sensor or future controller with a Linker

  delay_relay:
    name: "Delay Relay"
    lore: |-
      <arrow> Delays ON and OFF transitions independently
      <arrow> Input changes cancel stale pending transitions automatically
      <arrow> Configure each delay from instant to 60 seconds

  pulse_relay:
    name: "Pulse Relay"
    lore: |-
      <arrow> Fires a timed vanilla redstone pulse on a rising Control Bus edge
      <arrow> Configure 1 tick to 60 seconds and test it from the GUI
      <arrow> Replayed ON state after restart does not trigger a false pulse

  inventory_sensor:
    name: "Inventory Sensor"
    lore: |-
      <arrow> Watches the adjacent inventory in the direction it faces
      <arrow> Supports Rebar logistics/virtual inventories and vanilla containers
      <arrow> Publishes only when the measured inventory snapshot changes

  machine_sensor:
    name: "Machine Sensor"
    lore: |-
      <arrow> Watches an adjacent released Rebar processor/recipe processor
      <arrow> Publishes processing state, normalized progress, and time remaining
      <arrow> Persists observed active-to-idle cycle count and last-cycle time
      <arrow> Right click to inspect; shift-right-click Reset for a new batch
      <arrow> Reset keeps an active processing baseline for the next cycle
      <arrow> Cycle count is activity telemetry, not a guaranteed output count
      <arrow> Unsupported blocks report unavailable instead of guessing
      <arrow> Never uses Rebar's internal ticking registry

  fluid_valve:
    name: "Fluid Valve"
    lore: |-
      <arrow> Public-API Rebar fluid pass-through with a one-bucket transit buffer
      <arrow> CLOSED requests and supplies 0 mB; stored fluid remains safely buffered
      <arrow> Accepts Default/A-D circuits or addressed Control Bus commands
      <arrow> Route changes fail safe CLOSED before state replay

  fluid_sensor:
    name: "Fluid Tank Sensor"
    lore: |-
      <arrow> Watches the adjacent Rebar fluid tank it faces
      <arrow> Publishes fluid type, amount, capacity, and fill ratio
      <arrow> Never loads another chunk just to sample a tank

  power_grid_sensor:
    name: "Power Grid Sensor"
    lore: |-
      <arrow> Faces an adjacent block exposed by a registered power provider
      <arrow> Publishes capacity, demand, reserve, load, and consumer health
      <arrow> Samples once per configured interval and only publishes changes
      <arrow> Never forces adjacent chunks to load

  factory_controller:
    name: "Factory Controller"
    lore: |-
      <arrow> Combines up to two sensor conditions with AND/OR logic
      <arrow> AUTO-bind or explicitly choose directly linked sources
      <arrow> Right click to configure rules, presets, sources, and output routing

  batch_controller:
    name: "Batch Controller"
    lore: |-
      <arrow> Aggregates new cycle deltas from directly linked Machine Sensors
      <arrow> First count after link/relink is a baseline, never historical work
      <arrow> Persists batch progress and latches ON when the target is reached
      <arrow> Optional no-progress watchdog latches a fault on stalled production
      <arrow> Fault-period machine counts rebaseline without adding batch progress
      <arrow> Named Reset/Start input can begin the next batch automatically
      <arrow> Replay-safe rising edges prevent restart from resetting a batch
      <arrow> Reset clears fault while preserving live source baselines
      <arrow> Completion uses Circuit/Address routing; fault uses a named address

  sequence_controller:
    name: "Sequence Controller"
    lore: |-
      <arrow> Runs a four-stage event-driven factory sequence
      <arrow> Each stage has a unique trigger address and active output address
      <arrow> Rising-edge triggers advance only the currently active stage
      <arrow> Optional stage timeout enters a persistent FAULT state
      <arrow> Fault output uses its own collision-safe named address
      <arrow> Timeout is OFF by default; only one delayed task exists while running
      <arrow> Sequence stage survives reload; replay never manufactures advances

  power_limiter:
    name: "Power Limiter"
    lore: |-
      <arrow> Applies a configurable watt cap to one provider-exposed branch
      <arrow> Boolean input enables the cap; false bypasses to unlimited
      <arrow> Accepts Default/A-D circuits or addressed automation commands
      <arrow> Uses the same event-driven provider/chunk lifecycle as Smart Breaker

  smart_breaker:
    name: "Smart Breaker"
    lore: |-
      <arrow> Opens or closes one provider-exposed electrical branch
      <arrow> Faces the target power port/branch without forcing chunks to load
      <arrow> Accepts Default/A-D circuits or human-readable addressed commands
      <arrow> Reconciles automatically when providers or target chunks return

  load_shedding_controller:
    name: "Load Shedding Controller"
    lore: |-
      <arrow> Uses complete Power Grid Sensor snapshots with hysteresis
      <arrow> Drives Essential, Normal, and Optional addressed load groups
      <arrow> Optional loads shed first; normal loads shed under severe stress
      <arrow> Configure shed/restore hysteresis and missing-telemetry fail-safe behavior

  factory_monitor:
    name: "Factory Monitor"
    lore: |-
      <arrow> Displays live Control Bus telemetry without polling machines
      <arrow> Pages: Automation, Resources, Production, Power & Alarms
      <arrow> Cycle between overview and individual source nodes on every page
      <arrow> Refresh prunes disconnected sources and replays loaded state
      <arrow> Never scans worlds or forces chunks to load

  gridworks_linker:
    name: "GridWorks Linker"
    lore: |-
      <arrow> <insn>Right click</insn> a control node to select it
      <arrow> <insn>Right click</insn> another to link or unlink
      <arrow> <insn>Sneak + right click</insn> to inspect the network
      <arrow> <insn>Sneak + left click</insn> an actuator to cycle its input circuit
