control-bus:
  # Safety cap for the number of recipient nodes a single signal may traverse.
  # This prevents a malformed or unexpectedly huge control network from doing
  # unbounded work in one dispatch. GridWorks also caches unchanged routes.
  max-propagation-nodes: 4096

sensors:
  inventory:
    # Desired full-sweep interval for loaded Inventory Sensors.
    # Work is round-robin distributed across ticks instead of all sensors
    # waking up together. 10 ticks = 0.5 seconds at 20 TPS.
    sample-interval-ticks: 10

    # Hard ceiling on Inventory Sensor probes in one server tick.
    # If the loaded population exceeds interval * budget, the sweep interval
    # stretches gracefully instead of causing one large tick spike.
    max-samples-per-tick: 128

  fluid:
    # Desired full-sweep interval for loaded Fluid Sensors.
    sample-interval-ticks: 10
    max-samples-per-tick: 128

  machine:
    # Released Rebar processor APIs expose state but no universal state-change
    # event, so loaded Machine Sensors use one distributed shared sampler.
    sample-interval-ticks: 20
    max-samples-per-tick: 64

  power:
    # Provider queries may need to inspect an electricity graph, so power
    # sampling uses the smallest default per-tick budget.
    sample-interval-ticks: 20
    max-samples-per-tick: 32

cargo:
  isolator:
    # Rebar cargo transfer-rate units. Closed isolators always force this to 0.
    # Keep this conservative by default; server owners can raise it if desired.
    transfer-rate: 1
