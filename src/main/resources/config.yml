control-bus:
  # Safety cap for the number of recipient nodes a single signal may traverse.
  # This prevents a malformed or unexpectedly huge control network from doing
  # unbounded work in one dispatch.
  max-propagation-nodes: 4096

sensors:
  inventory:
    # Inventory mutations do not have one universal Bukkit event. GridWorks
    # therefore uses one shared sampler for loaded Inventory Sensors only.
    # 10 ticks = 0.5 seconds at 20 TPS.
    sample-interval-ticks: 10


  fluid:
    # Rebar's released fluid tank API exposes state cleanly, but does not emit
    # one universal change event for every tank implementation. GridWorks uses
    # one shared sampler for loaded Fluid Sensors only.
    # 10 ticks = 0.5 seconds at 20 TPS.
    sample-interval-ticks: 10
